name: Build & Publish Docker Image

# 触发时机：推送到 main / 打 tag v* / 手动触发
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: "镜像标签后缀（可选，例如 beta / test）"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}     # DTQEight/dxp4800-log-collector

jobs:
  build-and-push:
    name: 多架构镜像构建并推送 GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write           # 推送 GHCR 必须
      attestations: write
      id-token: write

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 设置 QEMU（跨架构构建必需）
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # CI 自动提供，无需手动建 secret

      - name: 提取镜像元数据（tags / labels）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 打 git tag v1.2.3 → 同时生成 :1.2.3 / :1.2 / :1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # main 分支 → :latest
            type=raw,value=latest,enable={{is_default_branch}}
            # 短 commit sha
            type=sha,format=short
            # 手动触发带后缀
            type=raw,value=${{ inputs.tag_suffix }},enable=${{ inputs.tag_suffix != '' }}
          labels: |
            org.opencontainers.image.title=dxp4800-log-collector
            org.opencontainers.image.description=绿联 DXP4800 NAS Docker 日志收集工具
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.licenses=MIT

      - name: 构建并推送镜像
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          platforms: |
            linux/amd64
            linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 生成构建产物摘要
        run: |
          echo "## ✅ 镜像已发布到 GHCR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| 仓库地址 | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 支持架构 | linux/amd64, linux/arm64（DXP4800 x86 版用 amd64） |" >> $GITHUB_STEP_SUMMARY
          echo "| Tags | \`\`\`${{ steps.meta.outputs.tags }}\`\`\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "NAS 拉取命令：" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker compose pull && docker compose up -d" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
