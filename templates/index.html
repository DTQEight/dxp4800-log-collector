<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>DXP4800 Docker 日志中心</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        * { box-sizing:border-box; }
        :root {
            --log-font-size: 13.5px;
            --log-line-height: 1.6;
        }
        html, body { height:100%; }
        body {
            margin:0;
            font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
            background:#f8fafc; color:#0f172a;
            display:flex; height:100vh; overflow:hidden;
        }
        .icon-btn.tail-btn.active {
            background:#2563eb; border-color:#2563eb; color:#fff;
            box-shadow: 0 1px 2px rgba(37,99,235,.35);
        }
        .icon-btn.auto-btn.active {
            background:#16a34a; border-color:#16a34a; color:#fff;
            box-shadow: 0 1px 2px rgba(22,163,74,.35);
        }

        /* ===== 左侧容器列表 ===== */
        aside {
            width:260px; min-width:260px;
            background:#1e293b; color:#f1f5f9;
            display:flex; flex-direction:column;
        }
        aside h3 {
            margin:0; padding:12px 16px;
            background:#0f172a; font-size:15px; font-weight:600;
            border-bottom:1px solid #334155;
            display:flex; align-items:center; justify-content:space-between;
        }
        #container-list { flex:1; overflow:auto; }
        .ctn { padding:9px 16px; cursor:pointer; border-left:3px solid transparent; display:flex; flex-direction:column; gap:2px; }
        .ctn:hover { background:#334155; }
        .ctn.active { background:#334155; border-left-color:#22c55e; }
        .ctn .n { font-size:13.5px; font-weight:500; word-break:break-all; }
        .ctn .s { font-size:11.5px; opacity:.75; display:flex; justify-content:space-between; }
        .status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#64748b; margin-right:6px; vertical-align:middle; }
        .status-dot.run { background:#22c55e; }
        a.logout { color:#94a3b8; text-decoration:none; font-size:12.5px; }

        /* ===== 右侧主区 ===== */
        main { flex:1; display:flex; flex-direction:column; min-width:0; }
        header {
            padding:8px 14px; background:#fff;
            border-bottom:1px solid #e2e8f0;
            display:flex; align-items:center; gap:8px; flex-wrap:wrap;
        }
        header h2 { margin:0; font-size:15px; margin-right:6px; flex:0 0 auto; max-width:42%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        header .spacer { flex:1; }
        header input, header select { padding:6px 9px; border:1px solid #cbd5e1; border-radius:6px; font-size:12.5px; }
        header input#kw { min-width:200px; }
        header button { padding:6px 11px; border:1px solid #cbd5e1; background:#fff; border-radius:6px; cursor:pointer; font-size:12.5px; }
        header button.primary { background:#2563eb; color:#fff; border-color:#2563eb; }
        header button:disabled { opacity:.55; cursor:not-allowed; pointer-events:none; }
        header button:hover { filter:brightness(.96); }

        .tabs {
            display:flex; gap:14px;
            padding:0 14px;
            background:#fff;
            border-bottom:1px solid #e2e8f0;
            align-items:center;
        }
        .tab {
            padding:8px 2px; font-size:13px; color:#64748b; cursor:pointer;
            border-bottom:2px solid transparent;
        }
        .tab.active { color:#2563eb; border-color:#2563eb; }

        /* ===== 预览区 ===== */
        .content {
            flex:1; min-height:0;
            display:flex; flex-direction:column;
            padding:8px 14px 12px 14px;
            gap:8px;
        }
        .toolbar {
            display:flex; gap:8px; flex-wrap:wrap; align-items:center;
            background:#fff; border:1px solid #e2e8f0; border-radius:8px;
            padding:6px 10px;
            transition: all .15s ease;
        }
        .toolbar.collapsed .files-list,
        .toolbar.collapsed .file-chip { display:none; }
        .toolbar .label { font-size:12.5px; color:#475569; margin-right:2px; }
        .toolbar .grow { flex:1; }
        .icon-btn {
            padding:4px 8px; font-size:12px; border-radius:6px;
            border:1px solid #cbd5e1; background:#fff; cursor:pointer;
            color:#334155;
        }
        .icon-btn:hover { background:#f1f5f9; }
        .icon-btn:disabled { opacity:.55; cursor:not-allowed; }

        .files-list {
            display:flex; flex-wrap:wrap; gap:6px;
            max-height:64px; overflow:auto;
            padding:4px;
            flex:1 1 100%;
            order:99;
        }
        .file-chip {
            padding:4px 10px; background:#f1f5f9; border:1px solid #e2e8f0;
            border-radius:16px; font-size:12px; cursor:pointer; white-space:nowrap;
            display:inline-flex; align-items:center; gap:6px;
        }
        .file-chip:hover { background:#e2e8f0; }
        .file-chip.active { background:#2563eb; color:#fff; border-color:#2563eb; }
        .file-chip .sz { font-size:10.5px; opacity:.7; }
        .file-chip.big { box-shadow: inset 0 -2px 0 #f59e0b; } /* 大文件黄条提醒 */

        .log-area {
            flex:1; min-height:0; width:100%;
            resize:none;
            background:#0b1120; color:#e2e8f0;
            border:1px solid #334155; border-radius:10px;
            padding:12px 14px;
            font-family:Consolas,Menlo,"JetBrains Mono",monospace;
            font-size:var(--log-font-size); line-height:var(--log-line-height);
            tab-size:4;
            outline:none;
            /* 禁用 textarea 重绘优化？不，用下面的 contain + scrollTop 切换避免全量回流 */
            content-visibility:auto;
            contain:strict;
        }
        .log-area.loading { color:#64748b; }
        .log-area.wrap   { white-space: pre-wrap; word-break: break-word; contain:layout paint; }
        .log-area.nowrap { white-space: pre; overflow-x:auto; contain:layout paint; }
        #search-view {
            background:#ffffff; color:#0f172a;
            border:1px solid #e2e8f0;
        }
        .empty { flex:1; display:flex; align-items:center; justify-content:center; color:#94a3b8; font-size:14px; }
        .font-size-tag { min-width:36px; text-align:center; font-variant-numeric:tabular-nums; font-size:12px; color:#334155; }

        .spinner {
            display:inline-block; width:12px; height:12px; border:2px solid #cbd5e1;
            border-top-color:#2563eb; border-radius:50%;
            animation: spin .8s linear infinite; vertical-align:-2px; margin-right:6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<aside>
    <h3>🐳 容器列表 <a href="/logout" class="logout">退出</a></h3>
    <div id="container-list"></div>
</aside>
<main>
    <header>
        <h2 id="page-title">请选择左侧容器查看日志</h2>
        <input id="kw" placeholder="搜索关键词 (支持模糊)">
        <input id="st" type="datetime-local" title="开始时间">
        <input id="et" type="datetime-local" title="结束时间">
        <button class="primary" onclick="searchLogs()">🔍 搜索</button>
        <button id="btn-live"   onclick="liveTail()">📡 实时日志</button>
        <button onclick="exportCsv()">⬇ CSV</button>
        <button onclick="exportJson()">⬇ JSON</button>
    </header>

    <div class="tabs">
        <div class="tab active" data-tab="file"   onclick="switchTab('file')">按日期文件</div>
        <div class="tab"        data-tab="search" onclick="switchTab('search')">数据库检索</div>
    </div>

    <div class="content">

        <!-- ===== 按日期文件 Tab ===== -->
        <div id="tab-file" style="flex:1;display:flex;flex-direction:column;min-height:0;gap:8px;">
            <div class="toolbar" id="file-toolbar">
                <span class="label">📅 文件</span>
                <button class="icon-btn" onclick="toggleFileList()" title="折叠/展开文件列表">
                    <span id="file-list-toggle-icon">▼</span>
                    <span id="file-list-toggle-text">收起</span>
                </button>
                <span class="label" style="margin-left:4px;">最近</span>
                <div id="tail-buttons" style="display:inline-flex;gap:4px;">
                    <button class="icon-btn tail-btn active" data-tail="20"    onclick="setTail(20)">20</button>
                    <button class="icon-btn tail-btn"        data-tail="100"   onclick="setTail(100)">100</button>
                    <button class="icon-btn tail-btn"        data-tail="500"   onclick="setTail(500)">500</button>
                    <button class="icon-btn tail-btn"        data-tail="2000"  onclick="setTail(2000)">2000</button>
                    <span class="font-size-tag" id="tail-tag" style="background:#e2e8f0;border-radius:6px;padding:2px 4px;">默认 20</span>
                </div>
                <span class="label" style="margin-left:6px;">🔄 自动刷新</span>
                <div id="auto-buttons" style="display:inline-flex;gap:4px;">
                    <button class="icon-btn auto-btn" data-sec="0"    onclick="setAuto(0)">关</button>
                    <button class="icon-btn auto-btn" data-sec="5"    onclick="setAuto(5)">5s</button>
                    <button class="icon-btn auto-btn active" data-sec="10"   onclick="setAuto(10)">10s</button>
                    <button class="icon-btn auto-btn" data-sec="30"   onclick="setAuto(30)">30s</button>
                    <button class="icon-btn auto-btn" data-sec="-1"   onclick="setAuto(-1)" title="真正实时（长连接 SSE，需后端 STREAM_ENABLED=true）">实时</button>
                    <span class="font-size-tag" id="auto-tag" style="background:#e2e8f0;border-radius:6px;padding:2px 4px;">默认 10s</span>
                </div>
                <button class="icon-btn" onclick="wrapToggle('log-view')">↩ 换行</button>
                <button class="icon-btn" onclick="zoomFont(-1)">A-</button>
                <span class="font-size-tag" id="font-size-tag">13.5</span>
                <button class="icon-btn" onclick="zoomFont(+1)">A+</button>
                <button class="icon-btn" onclick="scrollToBottom()">⬇ 底部</button>
                <button class="icon-btn" id="btn-full-file" onclick="loadFullFile()" title="忽略 tail 档位，加载整篇日志文件">📄 全文预览</button>
                <button class="icon-btn" onclick="downloadCurrentFile()">💾 下载</button>
                <div class="files-list" id="files-list">
                    <span style="color:#94a3b8;font-size:12px;">（暂无历史文件，等待收集器写入）</span>
                </div>
            </div>
            <textarea id="log-view" class="log-area nowrap" readonly></textarea>
        </div>

        <!-- ===== 数据库检索 Tab ===== -->
        <div id="tab-search" style="flex:1;display:none;flex-direction:column;min-height:0;gap:8px;">
            <div class="toolbar">
                <span class="label">🔍 检索结果</span>
                <button class="icon-btn" onclick="wrapToggle('search-view')">↩ 换行</button>
                <button class="icon-btn" onclick="zoomFont(-1)">A-</button>
                <span class="font-size-tag" id="font-size-tag-2">13.5</span>
                <button class="icon-btn" onclick="zoomFont(+1)">A+</button>
            </div>
            <textarea id="search-view" class="log-area nowrap" readonly></textarea>
        </div>
    </div>
</main>

<script>
/* -------- 全局状态 -------- */
let currentCid=null,currentName=null,currentFile=null,currentFileSize=0,currentTab='file';
let lastLiveTailPromise = null;
let lastLiveAbort = null;
let currentTail = 20;   // 默认只预览最近20条，快速切换不卡

/* -------- 自动刷新状态 -------- */
let autoMode = 10;      // 0=关, 正整数=秒数轮询, -1=SSE长连接实时
let autoTimer = 0;
let autoBytesOffset = null;   // 上次读到的文件字节长度，用于 from_bytes 增量
let autoSse = null;          // EventSource 实例（实时模式下）
let autoBusy = false;        // 上一次轮询还没回来，下一次跳过，防堆积

/* -------- 内存缓存：避免来回切换重复 HTTP -------- */
const fileTextCache = new Map();   // key = "name|filename|tail" -> Promise<string>
const liveTailCache = new Map();   // key = cid
const searchCache   = new Map();   // key = querystring
const MAX_CACHE = 30;
function cachePut(map,k,v){
    if(map.size>=MAX_CACHE){ const fst=map.keys().next().value; map.delete(fst); }
    map.set(k,v);
}

const $ = id => document.getElementById(id);

/* ---------------- 容器列表 ---------------- */
async function loadContainers(){
    try {
        const resp = await fetch('/api/containers');
        const list = await resp.json();
        const box = $('container-list'); box.innerHTML='';
        list.forEach(c => {
            const isRun = c.status==='running';
            const div = document.createElement('div');
            div.className = 'ctn'+(c.id===currentCid?' active':'');
            div.innerHTML = `
                <div class="n">${c.name}</div>
                <div class="s"><span><span class="status-dot ${isRun?'run':''}"></span>${c.status}</span><span>${(c.image||'').split('/').pop()}</span></div>`;
            div.onclick = ()=>selectContainer(c.id,c.name);
            box.appendChild(div);
        });
    } catch(e){ console.warn(e); }
}
function selectContainer(id,name){
    if(currentCid===id) return;               // 点同一个不重复
    // 取消之前正在执行的 tail 请求（防止旧请求晚到覆盖新内容）
    if(lastLiveAbort){ try{ lastLiveAbort.abort(); }catch(_){} }
    // 切换容器：停掉自动刷新，等选中新日期文件后再启动
    stopAutoRuntime();

    currentCid=id; currentName=name;
    document.querySelectorAll('.ctn').forEach(e=>e.classList.remove('active'));
    event.currentTarget.classList.add('active');
    $('page-title').textContent = name;

    // 立即显示占位文本（避免界面看起来"卡死"）
    showLoading('log-view', `正在加载 ${name} 的日志…`);

    // 让 UI 先刷一次，再异步取数据（关键：不阻塞点击反馈）
    if(currentTab==='file') setTimeout(loadFiles, 0);
}

/* ---------------- 工具函数：Loading / 分片赋值 ---------------- */
function fmtSize(b){
    if(b<1024) return b+'B';
    if(b<1024*1024) return (b/1024).toFixed(1)+'KB';
    return (b/1024/1024).toFixed(1)+'MB';
}
function showLoading(id, text){
    const ta = $(id);
    ta.classList.add('loading');
    ta.value = '⏳ ' + text + `\n（默认只显示最近 ${currentTail} 条，点击上方 20/100/500/2000 档位可切换；要看全文点「📄全文预览」）`;
}
/* 大字符串分块写入 textarea，避免一次性赋值导致 DOM 锁死 */
function setTextareaChunked(id, fullText){
    const ta = $(id);
    ta.classList.remove('loading');
    if(fullText.length < 200000){        // 小文件直接赋值，反而更快
        ta.value = fullText;
        ta.scrollTop = ta.scrollHeight;
        return;
    }
    ta.value = '';
    const CHUNK = 100000;                 // 100k chars/片
    let i = 0;
    function step(){
        if(i>=fullText.length){ ta.scrollTop = ta.scrollHeight; return; }
        const stop = Math.min(i+CHUNK, fullText.length);
        ta.value += fullText.slice(i, stop);
        i = stop;
        // requestIdleCallback 空闲时再写下一片，避免阻塞 UI 响应
        if(window.requestIdleCallback) requestIdleCallback(step,{timeout:100});
        else setTimeout(step, 0);
    }
    step();
}

/* ---------------- 文件列表 ---------------- */
async function loadFiles(){
    if(!currentName) return;
    try {
        const resp = await fetch(`/api/containers/${encodeURIComponent(currentName)}/files`);
        const { files } = await resp.json();
        const box = $('files-list'); box.innerHTML='';
        if(!files.length){
            box.innerHTML='<span style="color:#94a3b8;font-size:12px;">（暂无历史文件，等待收集器写入）</span>';
            $('log-view').classList.remove('loading');
            $('log-view').value='（暂无历史文件）'; return;
        }
        files.forEach((f,idx)=>{
            const chip = document.createElement('div');
            const name = typeof f==='string' ? f : f.name;
            const size = typeof f==='string' ? 0 : (f.size||0);
            const big  = size > 5*1024*1024;
            chip.className = 'file-chip'+(big?' big':'');
            chip.title = big ? `文件较大（>5MB）：默认预览最近 ${currentTail} 条，要看全文点「📄全文预览」` : '';
            chip.innerHTML = `<span>${name}</span>` + (size?`<span class="sz">${fmtSize(size)}</span>`:'');
            chip.onclick = ()=>readFile(name, chip, size);
            box.appendChild(chip);
        });
        // 默认选最新的
        const first = (typeof files[0]==='string') ? {name:files[0],size:0} : files[0];
        readFile(first.name, box.firstChild, first.size||0);
    } catch(e){
        console.warn(e);
        $('log-view').value='❌ 加载文件列表失败：'+e.message;
    }
}
async function readFile(fn, chip, size){
    currentFile=fn; currentFileSize=size||0;
    document.querySelectorAll('.file-chip').forEach(e=>e.classList.remove('active'));
    if(chip) chip.classList.add('active');
    $('btn-full-file').disabled = false;
    $('btn-full-file').textContent = (currentFileSize > 5*1024*1024) ? '📄 加载全文（慢）' : '📄 全文预览';

    // 切文件：重置自动刷新的偏移 & 停掉旧 SSE
    autoBytesOffset = null;
    stopAutoRuntime();

    const cacheKey = `${currentName}|${fn}|${currentTail}`;
    let p = fileTextCache.get(cacheKey);
    if(!p){
        showLoading('log-view', `正在读取 ${fn}${size?`（${fmtSize(size)}）`:''} 的最近 ${currentTail} 条…`);
        const ctrl = new AbortController();
        lastLiveAbort = ctrl;
        p = (async ()=>{
            try {
                const url = `/api/containers/${encodeURIComponent(currentName)}/files/${encodeURIComponent(fn)}?tail=${currentTail}`;
                const r = await fetch(url, { signal: ctrl.signal });
                if(r.status===404){ return '（文件不存在，可能是日期翻到新一天，点左侧容器重新拉文件列表）'; }
                const bytes = r.headers.get('X-Content-Bytes');
                if(bytes) autoBytesOffset = Number(bytes);
                return await r.text();
            } catch(err){
                if(err.name==='AbortError') return '';
                throw err;
            }
        })();
        cachePut(fileTextCache, cacheKey, p);
    }
    try {
        const text = await p;
        setTextareaChunked('log-view', text || `（${currentTail==0?'全文':`最近 ${currentTail} 条`}为空）`);
        // 打开时如果用户选了自动刷新，立刻启动一次
        startAutoRuntimeIfNeeded();
    } catch(e){
        $('log-view').classList.remove('loading');
        $('log-view').value = '❌ 读取失败：'+e.message;
    }
}

/* ---------- 自动刷新：开/关 + 档位 ---------- */
function setAuto(sec){
    autoMode = Number(sec)||0;
    document.querySelectorAll('.auto-btn').forEach(b=>{
        b.classList.toggle('active', Number(b.dataset.sec)===autoMode);
    });
    const tag = $('auto-tag');
    let label = '关';
    if (autoMode === -1) label = '实时';
    else if (autoMode > 0) label = `${autoMode}s`;
    if(tag) tag.textContent = label;

    stopAutoRuntime();
    startAutoRuntimeIfNeeded();
}
function stopAutoRuntime(){
    if(autoTimer){ clearInterval(autoTimer); autoTimer = 0; }
    if(autoSse){ try{ autoSse.close(); }catch(_){} autoSse=null; }
    autoBusy = false;
}
function startAutoRuntimeIfNeeded(){
    stopAutoRuntime();
    if(!currentFile || currentTab!=='file') return;
    if(autoMode === -1){
        startAutoSSE();
    } else if(autoMode > 0){
        autoTimer = setInterval(autoTickPoll, autoMode*1000);
    }
}
/* 轮询模式：传 from_bytes=当前末尾偏移，后端 f.seek(偏移) 只读追加部分 */
async function autoTickPoll(){
    if(autoBusy || !currentFile || !currentName) return;
    autoBusy = true;
    try {
        const qs = new URLSearchParams();
        if(autoBytesOffset != null) qs.set('from_bytes', String(autoBytesOffset));
        else qs.set('tail', String(currentTail || 20));
        const r = await fetch(`/api/containers/${encodeURIComponent(currentName)}/files/${encodeURIComponent(currentFile)}?${qs.toString()}`);
        if(r.status === 404){
            // 日期翻到新一天：刷新文件列表并自动切到新一天（如果有）
            if (currentTab==='file') await loadFiles();
            return;
        }
        const delta = await r.text();
        const bytes = r.headers.get('X-Content-Bytes');
        if(bytes) autoBytesOffset = Number(bytes);
        if(delta){
            // 只追加到末尾（小批量追加比整份重绘省 N 倍 CPU）
            const ta = $('log-view');
            const atBottom = (ta.scrollHeight - ta.scrollTop - ta.clientHeight) < 60;
            if(ta.value && !ta.value.endsWith('\n')) ta.value += '\n';
            ta.value += (ta.value && !delta.startsWith('\n') ? '\n' : '') + delta;
            if(atBottom) ta.scrollTop = ta.scrollHeight;
        }
    } catch(e){
        console.debug('auto tick err',e);
    } finally {
        autoBusy = false;
    }
}
/* 实时模式（SSE 长连接）：需要后端 STREAM_ENABLED=true，才用 /tail?stream=1 */
function startAutoSSE(){
    if(!currentCid) return;
    try {
        autoSse = new EventSource(`/api/containers/${encodeURIComponent(currentCid)}/tail?n=${Math.max(100, currentTail)}&stream=1`);
        autoSse.addEventListener('lines', (e)=>{
            try{
                const {lines} = JSON.parse(e.data);
                if(!lines || !lines.length) return;
                const ta = $('log-view');
                const atBottom = (ta.scrollHeight - ta.scrollTop - ta.clientHeight) < 60;
                if(ta.value && !ta.value.endsWith('\n')) ta.value += '\n';
                ta.value += lines.join('\n') + '\n';
                if(atBottom) ta.scrollTop = ta.scrollHeight;
            }catch(_){}
        });
        autoSse.addEventListener('error', ()=> stopAutoRuntime());
        autoSse.addEventListener('end',   ()=> stopAutoRuntime());
    } catch(e){
        console.warn('SSE failed, fall back to polling 10s', e);
        // 浏览器端 EventSource 失败就自动降级到 10s 轮询
        if(autoMode === -1) setAuto(10);
    }
}
function setTail(n){
    n = Number(n)||0;
    currentTail = n;
    document.querySelectorAll('.tail-btn').forEach(b=>{
        b.classList.toggle('active', Number(b.dataset.tail)===n);
    });
    const tag = $('tail-tag');
    if(tag) tag.textContent = (n===0 ? '全文' : `${n} 条`);
    // 立刻重新拉当前文件（有缓存就走缓存）
    if(currentFile){
        // 清掉同一文件旧档位的提示，用最新档位重拉
        const activeChip = document.querySelector('.file-chip.active');
        readFile(currentFile, activeChip || null, currentFileSize);
    }
}
async function loadFullFile(){
    if(!currentName||!currentFile){ alert('请先选择一个日志文件'); return; }
    if(!confirm(`确定加载全文？\n\n文件：${currentFile}\n大小：${fmtSize(currentFileSize)}\n\n默认只看最近 ${currentTail} 条（切档位不会卡顿），超过10MB建议直接"💾下载"后本地看。`)) return;
    showLoading('log-view', `正在加载全文 ${currentFile}…`);
    try {
        const url = `/api/containers/${encodeURIComponent(currentName)}/files/${encodeURIComponent(currentFile)}?full=1`;
        const r = await fetch(url);
        const text = await r.text();
        cachePut(fileTextCache, `${currentName}|${currentFile}|full`, Promise.resolve(text));
        setTextareaChunked('log-view', text);
    } catch(e){
        $('log-view').classList.remove('loading');
        $('log-view').value = '❌ 加载全文失败：'+e.message;
    }
}
function downloadCurrentFile(){
    if(!currentName||!currentFile){ alert('请先选择一个日志文件'); return; }
    window.open(`/api/containers/${encodeURIComponent(currentName)}/files/${currentFile}?format=download`);
}
function toggleFileList(){
    const tb = $('file-toolbar');
    tb.classList.toggle('collapsed');
    const collapsed = tb.classList.contains('collapsed');
    $('file-list-toggle-icon').textContent = collapsed ? '▶' : '▼';
    $('file-list-toggle-text').textContent = collapsed ? '展开' : '收起';
}

/* ---------------- 实时 tail / 搜索（均带防抖/缓存/取消） ---------------- */
let liveTailTimer = 0;
async function liveTail(){
    if(!currentCid){ alert('请先选择容器'); return; }
    switchTab('file');
    // 防抖：2s 内重复点击合并为一次
    clearTimeout(liveTailTimer);
    liveTailTimer = setTimeout(async ()=>{
        $('btn-live').disabled = true;
        showLoading('log-view', `正在获取 ${currentName} 实时日志（最后 1000 行）…`);
        const cacheKey = currentCid;
        let p = liveTailCache.get(cacheKey);
        const fresh_ms = 2500;       // 2.5 秒内重复点击用缓存
        if(p && Date.now() - p.ts < fresh_ms){ p = p.p; }
        else {
            if(lastLiveAbort) try{ lastLiveAbort.abort(); }catch(_){}
            const ctrl = new AbortController(); lastLiveAbort = ctrl;
            const pp = (async ()=>{
                const r = await fetch(`/api/containers/${currentCid}/tail?n=1000`,{signal:ctrl.signal});
                return await r.text();
            })();
            p = pp;
            liveTailCache.set(cacheKey, { ts: Date.now(), p: pp });
        }
        try {
            const text = await p;
            setTextareaChunked('log-view', text || '（暂无日志输出）');
        } catch(e){
            if(e.name!=='AbortError'){
                $('log-view').classList.remove('loading');
                $('log-view').value = '❌ 实时日志获取失败：'+e.message;
            }
        } finally {
            $('btn-live').disabled = false;
        }
    }, 200);
}

let searchTimer = 0;
function buildSearchParams(extra={}){
    const p = new URLSearchParams();
    if(currentCid) p.set('container_id', currentCid);
    const kw = $('kw').value.trim(); if(kw) p.set('keyword', kw);
    const st = $('st').value; if(st) p.set('start_time', new Date(st).toISOString());
    const et = $('et').value; if(et) p.set('end_time',   new Date(et).toISOString());
    p.set('limit', 1000);
    Object.entries(extra).forEach(([k,v])=>p.set(k,v));
    return p;
}
async function searchLogs(){
    switchTab('search');
    clearTimeout(searchTimer);
    searchTimer = setTimeout(async ()=>{
        showLoading('search-view', '正在检索…');
        const qs = buildSearchParams().toString();
        let p = searchCache.get(qs);
        if(!p){
            p = (async ()=>{
                const r = await fetch('/api/logs/search?'+qs);
                return await r.json();
            })();
            cachePut(searchCache, qs, p);
        }
        try {
            const rows = await p;
            const text = rows.map(r=>`[${r.timestamp}] [${r.container_name}] ${r.content}`).join('\n') || '（无匹配日志）';
            setTextareaChunked('search-view', text);
            $('search-view').scrollTop = 0;
        } catch(e){
            $('search-view').classList.remove('loading');
            $('search-view').value = '❌ 检索失败：'+e.message;
        }
    }, 200);
}
function exportCsv(){ window.open('/api/logs/search?format=csv&'+buildSearchParams().toString()); }
function exportJson(){ window.open('/api/logs/search?format=json_download&limit=10000&'+buildSearchParams().toString()); }

function switchTab(t){
    currentTab=t;
    document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active', e.dataset.tab===t));
    $('tab-file').style.display   = t==='file'   ? 'flex' : 'none';
    $('tab-search').style.display = t==='search' ? 'flex' : 'none';
    if(t!=='file') stopAutoRuntime();
    if(t==='file') startAutoRuntimeIfNeeded();
    if(t==='file' && currentName && !$('log-view').value) loadFiles();
}

/* ---------------- 字号 / 换行 / 滚到底 ---------------- */
let fontSize = 13.5;
function zoomFont(delta){
    fontSize = Math.max(11, Math.min(20, +(fontSize + delta).toFixed(1)));
    document.documentElement.style.setProperty('--log-font-size', fontSize+'px');
    const tag = $('font-size-tag'); if(tag) tag.textContent = fontSize;
    const tag2 = $('font-size-tag-2'); if(tag2) tag2.textContent = fontSize;
}
function wrapToggle(id){
    const el = $(id);
    const wasWrap = el.classList.contains('wrap');
    el.classList.toggle('wrap', !wasWrap);
    el.classList.toggle('nowrap', wasWrap);
}
function scrollToBottom(){
    const ta = currentTab==='file' ? $('log-view') : $('search-view');
    ta.scrollTop = ta.scrollHeight;
}

loadContainers();
setInterval(loadContainers, 60000);  // 容器列表 1 分钟刷一次就够
</script>
