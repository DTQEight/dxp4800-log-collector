<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>DXP4800 Docker 日志中心</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        * { box-sizing:border-box; }
        body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#f8fafc; color:#0f172a; display:flex; height:100vh; }
        aside { width:280px; background:#1e293b; color:#f1f5f9; display:flex; flex-direction:column; }
        aside h3 { margin:0; padding:20px 18px; background:#0f172a; font-size:16px; font-weight:600; border-bottom:1px solid #334155; }
        #container-list { flex:1; overflow:auto; }
        .ctn { padding:10px 18px; cursor:pointer; border-left:3px solid transparent; display:flex; flex-direction:column; gap:2px; }
        .ctn:hover { background:#334155; }
        .ctn.active { background:#334155; border-left-color:#22c55e; }
        .ctn .n { font-size:14px; font-weight:500; word-break:break-all; }
        .ctn .s { font-size:12px; opacity:.7; display:flex; justify-content:space-between; }
        .status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#64748b; margin-right:6px; }
        .status-dot.run { background:#22c55e; }
        main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
        header { padding:12px 20px; background:#fff; border-bottom:1px solid #e2e8f0; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        header h2 { margin:0; font-size:16px; margin-right:auto; }
        header input, header select { padding:7px 10px; border:1px solid #cbd5e1; border-radius:6px; font-size:13px; }
        header button { padding:7px 14px; border:1px solid #cbd5e1; background:#fff; border-radius:6px; cursor:pointer; font-size:13px; }
        header button.primary { background:#2563eb; color:#fff; border-color:#2563eb; }
        header button:hover { filter:brightness(.96); }
        .tabs { display:flex; gap:16px; padding:0 20px; background:#fff; border-bottom:1px solid #e2e8f0; }
        .tab { padding:10px 2px; font-size:13px; color:#64748b; cursor:pointer; border-bottom:2px solid transparent; }
        .tab.active { color:#2563eb; border-color:#2563eb; }
        .content { flex:1; overflow:hidden; display:flex; flex-direction:column; padding:12px 20px; gap:8px; }
        .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
        textarea#log-view {
            flex:1; width:100%; resize:none; background:#0f172a; color:#e2e8f0;
            border:1px solid #334155; border-radius:8px; padding:12px; font-family:Consolas,Menlo,monospace;
            font-size:12.5px; line-height:1.55;
        }
        .files-list { display:flex; flex-wrap:wrap; gap:8px; max-height:110px; overflow:auto; padding:8px; background:#fff; border:1px solid #e2e8f0; border-radius:8px; }
        .file-chip { padding:5px 10px; background:#f1f5f9; border:1px solid #e2e8f0; border-radius:20px; font-size:12px; cursor:pointer; }
        .file-chip.active { background:#2563eb; color:#fff; border-color:#2563eb; }
        a.logout { color:#94a3b8; text-decoration:none; font-size:13px; margin-left:8px; }
        .empty { flex:1; display:flex; align-items:center; justify-content:center; color:#94a3b8; font-size:14px; }
    </style>
</head>
<body>
<aside>
    <h3>🐳 容器列表 <a href="/logout" class="logout" style="float:right;font-weight:400;">退出</a></h3>
    <div id="container-list"></div>
</aside>
<main>
    <header>
        <h2 id="page-title">请选择左侧容器查看日志</h2>
        <input id="kw" placeholder="搜索关键词 (支持模糊)">
        <input id="st" type="datetime-local" title="开始时间">
        <input id="et" type="datetime-local" title="结束时间">
        <button class="primary" onclick="searchLogs()">🔍 搜索</button>
        <button onclick="liveTail()">📡 实时日志</button>
        <button onclick="exportCsv()">⬇ CSV</button>
        <button onclick="exportJson()">⬇ JSON</button>
    </header>
    <div class="tabs">
        <div class="tab active" data-tab="file" onclick="switchTab('file')">按日期文件</div>
        <div class="tab" data-tab="search" onclick="switchTab('search')">数据库检索</div>
    </div>
    <div class="content">
        <div id="tab-file">
            <div class="toolbar">
                <span style="font-size:13px;color:#475569;">文件：</span>
                <div class="files-list" id="files-list"><span style="color:#94a3b8;font-size:12px;">（暂无历史文件）</span></div>
            </div>
            <textarea id="log-view" readonly></textarea>
        </div>
        <div id="tab-search" style="display:none;flex:1;display:none;flex-direction:column;">
            <textarea id="search-view" readonly style="flex:1;background:#fff;color:#0f172a;border:1px solid #e2e8f0;border-radius:8px;padding:12px;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.6;resize:none;"></textarea>
        </div>
    </div>
</main>

<script>
let currentCid = null, currentName = null, currentFile = null, currentTab = 'file';

function $(id) { return document.getElementById(id); }

async function loadContainers() {
    const resp = await fetch('/api/containers');
    const list = await resp.json();
    const box = $('container-list');
    box.innerHTML = '';
    list.forEach(c => {
        const isRun = c.status === 'running';
        const div = document.createElement('div');
        div.className = 'ctn' + (c.id === currentCid ? ' active' : '');
        div.innerHTML = `
            <div class="n">${c.name}</div>
            <div class="s"><span><span class="status-dot ${isRun?'run':''}"></span>${c.status}</span><span>${(c.image||'').split('/').pop()}</span></div>`;
        div.onclick = () => selectContainer(c.id, c.name);
        box.appendChild(div);
    });
}

function selectContainer(id, name) {
    currentCid = id; currentName = name;
    document.querySelectorAll('.ctn').forEach(e => e.classList.remove('active'));
    event.currentTarget.classList.add('active');
    $('page-title').textContent = name;
    if (currentTab === 'file') loadFiles();
}

async function loadFiles() {
    if (!currentName) return;
    const resp = await fetch(`/api/containers/${encodeURIComponent(currentName)}/files`);
    const { files } = await resp.json();
    const box = $('files-list');
    box.innerHTML = '';
    if (!files.length) { box.innerHTML = '<span style="color:#94a3b8;font-size:12px;">（暂无历史文件，等待收集器写入）</span>'; $('log-view').value = ''; return; }
    files.forEach(fn => {
        const chip = document.createElement('div');
        chip.className = 'file-chip';
        chip.textContent = fn;
        chip.onclick = () => readFile(fn, chip);
        box.appendChild(chip);
    });
    readFile(files[0], box.firstChild);
}

async function readFile(fn, chip) {
    currentFile = fn;
    document.querySelectorAll('.file-chip').forEach(e => e.classList.remove('active'));
    if (chip) chip.classList.add('active');
    const resp = await fetch(`/api/containers/${encodeURIComponent(currentName)}/files/${fn}?format=text`);
    $('log-view').value = await resp.text();
    $('log-view').scrollTop = $('log-view').scrollHeight;
}

async function liveTail() {
    if (!currentCid) { alert('请先选择容器'); return; }
    const resp = await fetch(`/api/containers/${currentCid}/tail?n=500`);
    $('log-view').value = await resp.text();
    $('log-view').scrollTop = $('log-view').scrollHeight;
    switchTab('file');
}

function buildSearchParams(extra = {}) {
    const p = new URLSearchParams();
    if (currentCid) p.set('container_id', currentCid);
    const kw = $('kw').value.trim(); if (kw) p.set('keyword', kw);
    const st = $('st').value; if (st) p.set('start_time', new Date(st).toISOString());
    const et = $('et').value; if (et) p.set('end_time', new Date(et).toISOString());
    p.set('limit', 500);
    Object.entries(extra).forEach(([k,v]) => p.set(k, v));
    return p;
}

async function searchLogs() {
    switchTab('search');
    const resp = await fetch('/api/logs/search?' + buildSearchParams().toString());
    const rows = await resp.json();
    $('search-view').value = rows.map(r => `[${r.timestamp}] [${r.container_name}] ${r.content}`).join('\n') || '（无匹配日志）';
    $('search-view').scrollTop = 0;
}

function exportCsv() {
    window.open('/api/logs/search?format=csv&' + buildSearchParams().toString());
}
function exportJson() {
    window.open('/api/logs/search?format=json_download&limit=10000&' + buildSearchParams().toString());
}

function switchTab(t) {
    currentTab = t;
    document.querySelectorAll('.tab').forEach(e => e.classList.toggle('active', e.dataset.tab === t));
    $('tab-file').style.display = t === 'file' ? 'flex' : 'none';
    $('tab-search').style.display = t === 'search' ? 'flex' : 'none';
}

loadContainers();
setInterval(loadContainers, 30000);
</script>
</body>
</html>
