<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>登录 - DXP4800 日志中心</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:#f0f2f5; margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh; }
        .card { width:360px; background:#fff; border-radius:12px; padding:32px; box-shadow:0 4px 24px rgba(0,0,0,.08); }
        h2 { margin:0 0 24px; text-align:center; color:#1f2937; }
        label { display:block; font-size:14px; color:#4b5563; margin:12px 0 6px; }
        input { width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px; box-sizing:border-box; font-size:14px; }
        button { margin-top:20px; width:100%; padding:10px; background:#2563eb; color:#fff; border:0; border-radius:8px; font-size:15px; cursor:pointer; }
        button:hover { background:#1d4ed8; }
        .err { color:#dc2626; font-size:13px; margin-top:10px; text-align:center; }
    </style>
</head>
<body>
    <form class="card" method="post">
        <h2>绿联 DXP4800 日志中心</h2>
        <label>用户名</label>
        <input name="username" placeholder="admin" autofocus>
        <label>密码</label>
        <input name="password" type="password" placeholder="admin123">
        <button type="submit">登 录</button>
        {% if error %}<div class="err">{{ error }}</div>{% endif %}
    </form>
</body>
</html>
