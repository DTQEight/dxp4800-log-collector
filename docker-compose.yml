services:
  dxp4800-log-collector:
    image: ghcr.io/dtqeight/dxp4800-log-collector:latest
    # 指定具体版本更稳（避免 latest 漂移），例如：
    # image: ghcr.io/dtqeight/dxp4800-log-collector:1.0.0
    container_name: dxp4800-log-collector
    restart: unless-stopped
    # 嫌每次都检查镜像慢，可以删掉下面这行（只在本地没镜像时才拉）
    pull_policy: always
    ports:
      - "5000:5000"   # Web界面端口，可自行修改
    environment:
      - TZ=Asia/Shanghai
      # Web 登录账号密码（建议修改）
      - WEB_USERNAME=admin
      - WEB_PASSWORD=ChangeMe123!
      # 日志保留天数，超过会自动清理
      - LOG_RETENTION_DAYS=30
      # 每隔多少秒扫描一次容器并拉取增量日志（默认30s，CPU友好）
      # 想要更实时可以调到 10s，但 CPU 会上升
      - COLLECT_INTERVAL_SEC=30
      # 实时日志流（默认关），开 true 后日志产生即入库/触发通知
      # 但每个容器多一条常驻线程，日志刷得快的容器（go2rtc/数据库等）CPU会明显上升
      # 家用 NAS 推荐 false（默认）；CPU 富余且需要秒级通知再开 true
      - STREAM_ENABLED=false
      # 不需要收集日志的容器名（逗号分隔），默认排除自身
      # - EXCLUDE_CONTAINERS=dxp4800-log-collector

      # ===== 企业微信通知（监控错误日志，推送到企业微信） =====
      # 总开关：true 启用 / false 关闭（默认关闭，配置好下面三项再开启）
      - WECHAT_WORK_ENABLED=false
      # 企业ID（企业微信管理后台 -> 我的企业 -> 企业信息 -> 企业ID）
      - WECHAT_WORK_CORPID=
      # 应用Secret（自建应用 -> Secret；注意：仅创建时可见，需记好）
      - WECHAT_WORK_CORPSECRET=
      # 应用AgentId（自建应用 -> AgentId，整数）
      - WECHAT_WORK_AGENTID=0
      # 接收人：@all 表示全员，也可填指定用户ID，多个用 | 分隔（如 user1|user2）
      - WECHAT_WORK_TOUSER=@all
      # 错误关键字（逗号分隔）：日志命中任一关键字就触发通知
      - WECHAT_WORK_ERROR_KEYWORDS=ERROR,ERR,FATAL,PANIC,Exception,Traceback,Failed,failed,Out of memory,OOM
      # 单容器通知冷却（秒）：同一容器在该窗口内只推一条，避免错误日志洪水
      - WECHAT_WORK_COOLDOWN_SEC=60
      # 可选：只监控指定容器（逗号分隔，留空=全部容器），如 go2rtc,frpc
      # - WECHAT_WORK_INCLUDE_CONTAINERS=
      # 可选：首次启动时，N天前的历史错误日志要不要也推送？false=只推新错误（推荐），true=老错误也推
      - WECHAT_WORK_NOTIFY_ON_INIT=false
      # 可选：HTTP 代理（NAS 不能直连公网时使用），如 http://192.168.31.1:7890
      # - WECHAT_WORK_PROXY_URL=
    volumes:
      # 必须：挂载 Docker socket，才能读取 NAS 上所有容器的日志
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 日志文件归档目录（建议放到 NAS 共享盘绝对路径，如 /volume1/共享名/docker-logs）
      - ./logs:/app/logs
      # SQLite 索引数据库（存储搜索用元数据）
      - ./data:/app/data
    # 健康检查：自动判断 Web 服务是否正常
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/login',timeout=3).read()"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    # 资源限制（NAS 低功耗场景建议保留）
    mem_limit: 512m
    cpus: "1.0"
    # 本工具自身的日志滚动策略，避免把 docker 自身的 json 日志撑爆
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # ======= 需要本地自己构建时，用下面两行替换上面 image: 那一行 =======
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   pull: true
